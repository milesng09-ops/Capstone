# Run both suites on every push, because nobody is running them by hand.
#
# There are ~900 tests across the two halves of this project and, until this
# file, the only thing standing between a broken push and a broken checkout
# was somebody remembering. That got riskier once the code started being
# edited from an assistant and pushed straight to master: the person pushing
# is not always the person who can tell whether the suite still passes.
#
# The browser tests are a separate job rather than a step of the frontend one.
# They need a Chromium download, so folding them in would make the fast
# feedback wait on the slow thing for no reason.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant, so stop it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor is PEP 604 `str | None`, which Pydantic and SQLAlchemy
          # evaluate when the models are built, so 3.10 is the real minimum.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run the suite
        working-directory: frontend
        run: npm run test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Only Chromium: these tests are about this app's layout, not about
      # cross-browser behaviour, and the other two double the download.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The API is stubbed in the specs, so no backend and no provider key.
      - name: Run the browser tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
